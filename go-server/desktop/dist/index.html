<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Grabby</title>
<link rel="icon" type="image/png" href="/icon-32.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-drag"></div>
    <div class="brand">
      <img class="brand-mark" src="/icon-32.png" alt="" aria-hidden="true">
      <span class="brand-name">Grabby</span>
    </div>
    <nav class="nav" id="nav" aria-label="主导航">
      <div class="nav-group-label">内容</div>
      <button class="nav-item is-active" data-view="today" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3" width="15" height="14" rx="2.5"/><path d="M2.5 8h15M6.5 2v2M13.5 2v2"/></svg>
        <span>今天</span>
      </button>
      <button class="nav-item" data-view="library" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3" width="6" height="14" rx="1.5"/><rect x="10.5" y="3" width="7" height="6" rx="1.5"/><rect x="10.5" y="11" width="7" height="6" rx="1.5"/></svg>
        <span>内容库</span>
      </button>
      <button class="nav-item" data-view="sources" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="5" cy="15" r="1.6"/><path d="M3.5 3.5v5a8 8 0 0 0 8 8h2M3.5 3.5a13 13 0 0 1 13 13v0"/><path d="M3.5 3.5a6 6 0 0 1 6 6"/></svg>
        <span>RSS 源</span>
      </button>
      <button class="nav-item" data-view="news" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12.5" rx="2"/><path d="M5 7.5h5v4H5zM12 7.5h3M12 10h3M5 13.5h10"/></svg>
        <span>新闻源</span>
      </button>

      <div class="nav-group-label">智能</div>
      <button class="nav-item" data-view="ai" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5l1.6 4.2 4.4.3-3.4 2.8 1.1 4.3L10 11.7l-3.7 2.4 1.1-4.3L4 7l4.4-.3z"/><path d="M15.5 14.5l.6 1.5 1.5.3-1.1 1 .3 1.5-1.3-.8-1.3.8.3-1.5-1.1-1 1.5-.3z"/></svg>
        <span>AI 分析</span>
      </button>
      <button class="nav-item" data-view="daily" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="2.5" width="14" height="15" rx="2"/><path d="M6.5 6.5h7M6.5 9.5h7M6.5 12.5h4"/></svg>
        <span>AI 日报</span>
      </button>

      <div class="nav-group-label">服务</div>
      <button class="nav-item" data-view="devices" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3.5" width="16" height="11" rx="2"/><path d="M7 17h6M10 14.5V17"/></svg>
        <span>浏览器设备</span>
      </button>
      <button class="nav-item" data-view="apihub" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5 3 10l4 5M13 5l4 5-4 5M11.5 3.5l-3 13"/></svg>
        <span>API 接入</span>
      </button>

      <div class="nav-group-label">偏好</div>
      <button class="nav-item" data-view="settings" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.4 4.4l1.4 1.4M14.2 14.2l1.4 1.4M15.6 4.4l-1.4 1.4M5.8 14.2l-1.4 1.4"/></svg>
        <span>设置</span>
      </button>
    </nav>
    <div class="sidebar-section-label">状态</div>
    <div class="service-card" id="service-card">
      <div class="service-row">
        <span class="status-dot" id="status-dot"></span>
        <span id="service-status">正在连接…</span>
      </div>
      <div class="service-sub" id="service-sub">本地 API 服务</div>
    </div>
    <footer class="sidebar-footer" id="sidebar-footer">
      <nav class="sidebar-links" aria-label="Grabby 相关链接">
        <a href="https://chromewebstore.google.com/detail/mcp-%E7%BD%91%E9%A1%B5%E5%86%85%E5%AE%B9%E9%87%87%E9%9B%86%E5%B7%A5%E5%85%B7/hfimnafeekedoeeflppddlkbhcbbnfab" target="_blank" rel="noopener" title="安装浏览器插件">浏览器插件</a>
        <a href="https://grabby.eztoolab.com" target="_blank" rel="noopener" title="打开项目网站">项目网站</a>
        <a href="https://github.com/gusibi/grabby/releases" target="_blank" rel="noopener" title="查看版本更新">Releases</a>
      </nav>
      <div>Grabby Desktop</div>
    </footer>
  </aside>

  <main class="main">
    <header class="topbar" id="topbar">
      <div class="topbar-drag"></div>
      <div class="topbar-inner">
        <div class="topbar-head" id="topbar-head"></div>
        <div class="topbar-actions">
          <div class="view-switch" id="view-switch" role="group" aria-label="展示方式" hidden>
            <button class="view-switch-btn is-active" data-action="layout" data-layout="grid" type="button"
              aria-label="卡片视图" aria-pressed="true" title="卡片视图 · V">
              <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="2.5" width="6.4" height="6.4" rx="1.6"/><rect x="11.1" y="2.5" width="6.4" height="6.4" rx="1.6"/><rect x="2.5" y="11.1" width="6.4" height="6.4" rx="1.6"/><rect x="11.1" y="11.1" width="6.4" height="6.4" rx="1.6"/></svg>
            </button>
            <button class="view-switch-btn" data-action="layout" data-layout="list" type="button"
              aria-label="列表视图" aria-pressed="false" title="列表视图 · V">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.2h14M3 10h14M3 14.8h9"/></svg>
            </button>
          </div>
          <div class="search" id="search-wrap" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.6 3.6"/></svg>
            <input id="search-input" type="search" placeholder="搜索内容" autocomplete="off">
          </div>
          <button class="icon-btn" id="refresh-btn" type="button" title="刷新">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 7a6.5 6.5 0 1 0 .6 4.5M16 3.5V7h-3.5"/></svg>
          </button>
        </div>
      </div>
    </header>

    <div class="workspace" id="workspace">
      <div class="content" id="content"></div>
      <div class="reader-scrim" id="reader-scrim"></div>
      <aside class="reader" id="reader" role="region" aria-label="文章阅读" aria-hidden="true" tabindex="-1">
        <div class="reader-progress" aria-hidden="true"><span id="reader-progress-bar"></span></div>
        <div class="reader-shell" id="reader-shell">
          <header class="reader-bar" id="reader-bar">
            <button class="reader-nav-btn" id="reader-close" type="button" aria-label="关闭阅读面板（Esc）" title="关闭 · Esc">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
            </button>
            <div class="reader-bar-label" id="reader-kicker">阅读</div>
            <div class="reader-bar-actions">
              <div class="reader-pager">
                <button class="reader-nav-btn" id="reader-prev" type="button" aria-label="上一篇（K）" title="上一篇 · K">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 12.5 10 7l5 5.5"/></svg>
                </button>
                <button class="reader-nav-btn" id="reader-next" type="button" aria-label="下一篇（J）" title="下一篇 · J">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7.5 10 13l5-5.5"/></svg>
                </button>
              </div>
              <button class="reader-star" id="reader-star" type="button" aria-label="收藏" aria-pressed="false" title="收藏">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.9l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L2.8 8.2l5-.7z"/></svg>
              </button>
            </div>
          </header>
          <div class="reader-scroll" id="reader-scroll">
            <div class="reader-body" id="reader-body"></div>
          </div>
        </div>
      </aside>
    </div>
  </main>
</div>

<div class="modal hidden" id="login-modal">
  <div class="modal-card">
    <h2>需要管理员密钥</h2>
    <p>此服务已启用鉴权。请输入 <code>GRABBY_ADMIN_KEY</code> 后继续。</p>
    <input id="login-key" type="password" placeholder="管理员密钥" autocomplete="off">
    <div class="modal-error" id="login-error"></div>
    <div class="modal-actions">
      <button class="btn primary" id="login-submit" type="button">解锁</button>
    </div>
  </div>
</div>

<div class="modal hidden" id="dialog-modal">
  <div class="modal-card dialog-card" id="dialog-card"></div>
</div>

<div class="toast hidden" id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
