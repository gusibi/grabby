name: Release Grabby

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "要构建的版本号（不带 v，例如 0.2.0）；手动构建只上传产物，不创建 Release"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.3"
  NODE_VERSION: "22"
  GO_PROXY: "https://proxy.golang.org,direct"
  GOPROXY: "https://proxy.golang.org,direct"
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  frontend:
    name: Build web frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: go-server/frontend/package-lock.json
      - name: Install dependencies
        working-directory: go-server/frontend
        run: npm ci
      - name: Build
        working-directory: go-server/frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: go-server/frontend/dist
          if-no-files-found: error

  extension:
    name: Build Chrome extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: chrome-extension/package-lock.json
      - name: Install dependencies
        working-directory: chrome-extension
        run: npm ci
      - name: Build defuddle bundle
        working-directory: chrome-extension
        run: npm run build
      - name: Package extension
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          mkdir -p dist
          cd chrome-extension
          zip -r "../dist/grabby-extension-${VERSION}.zip" \
            manifest.json \
            background.js \
            content/ \
            lib/ \
            icons/ \
            popup/ \
            options/ \
            offscreen/ \
            PRIVACY_POLICY*.md \
            -x "lib/*.map" \
            -x "src/*" \
            -x "node_modules/*" \
            -x "package.json" \
            -x "package-lock.json" \
            -x "build.js" \
            -x "logs/*"
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/grabby-extension-*.zip
          if-no-files-found: error

  server:
    name: Build server (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go-server/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: go-server/frontend/dist
      - name: Build and package
        working-directory: go-server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          mkdir -p ../dist/stage
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -trimpath -ldflags "-s -w" -o "../dist/stage/grabby-server${EXT}" .
          cp ../readme.md ../dist/stage/
          cd ../dist/stage
          if [ "$GOOS" = "windows" ]; then
            zip -j "../grabby-server_${VERSION}_${GOOS}_${GOARCH}.zip" ./*
          else
            tar -czf "../grabby-server_${VERSION}_${GOOS}_${GOARCH}.tar.gz" ./*
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/grabby-server_*.tar.gz
            dist/grabby-server_*.zip
          if-no-files-found: error

  cli:
    name: Build CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go-cli/go.sum
      - name: Build and package
        working-directory: go-cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          OS="${GOOS}"
          if [ "$OS" = "darwin" ]; then OS="Darwin"; fi
          if [ "$OS" = "linux" ]; then OS="Linux"; fi
          if [ "$OS" = "windows" ]; then OS="Windows"; fi
          ARCH="$GOARCH"
          if [ "$ARCH" = "amd64" ]; then ARCH="x86_64"; fi
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          mkdir -p ../dist/stage
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/gusibi/mcp-web-capture/go-cli/cmd.version=${VERSION} \
              -X github.com/gusibi/mcp-web-capture/go-cli/cmd.commit=${GITHUB_SHA::7} \
              -X github.com/gusibi/mcp-web-capture/go-cli/cmd.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "../dist/stage/grabby${EXT}" .
          cp ../readme.md ../dist/stage/
          cd ../dist/stage
          if [ "$GOOS" = "windows" ]; then
            zip -j "../grabby_${OS}_${ARCH}.zip" ./*
          else
            tar -czf "../grabby_${OS}_${ARCH}.tar.gz" ./*
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/grabby_*.tar.gz
            dist/grabby_*.zip
          if-no-files-found: error

  desktop-macos:
    name: Build macOS app (universal DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go-server/go.sum
      - name: Build DMG
        run: bash scripts/package-desktop.sh macos "${VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: dist/Grabby-*-macOS-*.dmg
          if-no-files-found: error

  desktop-windows:
    name: Build Windows app (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go-server/go.sum
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis zip
      - name: Build exe, zip and installer
        env:
          ARCH: ${{ matrix.arch }}
        run: bash scripts/package-desktop.sh windows "${VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ matrix.arch }}
          path: |
            dist/Grabby-*-Windows-${{ matrix.arch }}.exe
            dist/Grabby-*-Windows-${{ matrix.arch }}.zip
            dist/Grabby-*-Windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  desktop-linux:
    name: Build Linux app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go-server/go.sum
      - name: Build binary, tarball and deb
        run: bash scripts/package-desktop.sh linux "${VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            dist/Grabby-*-Linux-*.tar.gz
            dist/grabby_*.deb
          if-no-files-found: error

  test:
    name: Go tests
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go-server/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: go-server/frontend/dist
      - name: Run Go tests
        working-directory: go-server
        run: go test ./...

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, extension, server, cli, desktop-macos, desktop-windows, desktop-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-macos
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-windows-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-linux
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name checksums.txt -print0 | sort -z | xargs -0 sha256sum > /tmp/checksums.txt
          mv /tmp/checksums.txt checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Grabby ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
