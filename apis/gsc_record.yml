info:
  name: gsc_record
  type: http
  seq: 20

http:
  method: post
  url: "{{host}}/api/gsc/record"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-API-Key
      value: "{{api_key}}"
    - name: X-Grabby-Token
      value: "{{api_key}}"
  body:
    type: json
    data: |-
      {
        "kind": "performance",
        "property": "sc-domain:example.com",
        "days": 28
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
