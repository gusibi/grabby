info:
  name: screenshot
  type: http
  seq: 3

http:
  method: post
  url: http://localhost:5040/api/screenshot
  headers:
    - name: Content-Type
      value: application/json
    - name: X-API-Key
      value: your_api_key
  body:
    type: json
    data: |-
      {
        "url": "https://example.com",
        "fullPage": true
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
