info:
  name: twitter_likes
  type: http
  seq: 11

http:
  method: post
  url: "{{host}}/api/twitter/likes"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-API-Key
      value: "{{api_key}}"
    - name: X-Grabby-Token
      value: "{{api_key}}"
  body:
    type: json
    data: |-
      {
        "handle": "gusibix",
        "limit": 60
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
