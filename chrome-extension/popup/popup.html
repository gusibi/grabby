<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grabby</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="header-top">
        <h1>Grabby</h1>
        <div class="connection-status disconnected">
          <span id="statusDot" class="status-dot disconnected"></span>
          <span id="statusText">未连接</span>
        </div>
      </div>
      <div id="serverInfo" class="server-info">服务器: 未配置</div>
    </header>
    
    <div class="card">
      <div class="action-buttons">
        <button id="connectBtn" class="btn primary">
          <span>🔌 连接服务器</span>
        </button>
        <button id="disconnectBtn" class="btn secondary" disabled>
          <span>断开连接</span>
        </button>
      </div>
    </div>
    
    <div class="card">
      <div class="content-actions">
        <div class="action-group">
          <button id="captureBtn" class="btn secondary">
            <span>📷 截图当前页面</span>
          </button>
          <div class="option-group">
            <input type="checkbox" id="fullPageCapture" checked>
            <label for="fullPageCapture">全页面截图</label>
          </div>
        </div>
        
        <div class="action-group">
          <button id="extractBtn" class="btn primary">
            <span>📋 提取当前页面内容</span>
          </button>
        </div>
      </div>
    </div>
    
    <div id="resultPreview" class="result-preview" style="display: none;">
      <div class="preview-header">
        <h3>结果预览</h3>
        <div class="preview-actions">
          <button id="saveResultBtn" class="btn small primary">
            <span>💾 保存</span>
          </button>
          <button id="copyResultBtn" class="btn small secondary">
            <span>📋 复制</span>
          </button>
          <button id="closePreviewBtn" class="btn small secondary">
            <span>✖</span>
          </button>
        </div>
      </div>
      <div id="previewContent" class="preview-content"></div>
    </div>
    
    <footer class="popup-footer">
      <button id="openOptionsBtn" class="btn text">
        <span>⚙️ 设置</span>
      </button>
      <button id="openLogsBtn" class="btn text">
        <span>📝 查看日志</span>
      </button>
    </footer>
  </div>
  
  <script src="popup.js" type="module"></script>
</body>
</html>
